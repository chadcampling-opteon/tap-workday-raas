send_anonymous_usage_stats: true
project_id: "tap-workday-raas"
default_environment: test
requires_meltano: ">=4.0"
environments:
- name: test
plugins:
  extractors:
  - name: "tap-workday-raas"
    namespace: "tap_workday_raas"
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging

    settings:
    - name: username
      label: Username
      description: Workday account username for HTTP Basic Auth

    - name: password
      label: Password
      description: Workday account password for HTTP Basic Auth
      sensitive: true

    - name: reports
      kind: array
      label: Reports
      description: >
        Workday RaaS reports to extract. Each report object requires report_name
        and report_url. Optional incremental fields include state_param,
        replication_key, start_date, start_value, and state_param_format.

    - name: request_timeout
      kind: integer
      label: Request timeout
      value: 300
      description: >
        HTTP request timeout in seconds for report and schema downloads.
        Defaults to 300. Set to null for no timeout.

    settings_group_validation:
    - [username, password, reports]

  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
